<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Blood Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-bar-mount"></div>
  <main class="auth-page">
    <div class="mui-card">
      <div id="back-button-mount"></div>
      <h2>Forgot Password</h2>
      <p id="error-message" class="alert alert-error page-hidden"></p>
      <p id="success-message" class="alert alert-success page-hidden"></p>
      <div id="dev-reset-link-box" class="page-hidden">
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 12px;">
          No email service is set up yet, so here's the reset link directly:
        </p>
        <p><a id="dev-reset-link" class="text-link" href="#"></a></p>
      </div>
      <form id="forgot-password-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <button type="submit">Send Reset Link</button>
      </form>
      <p><a class="text-link" href="login.html">Back to Login</a></p>
    </div>
  </main>
  <script src="../js/accountTypes.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
