<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Donors - Blood Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-bar-mount"></div>
  <main class="page-content">
    <div class="mui-card wide-box">
      <div id="back-button-mount"></div>
      <h2>Search Donors</h2>
      <form id="search-form" class="search-form">
        <select name="bloodGroup" id="bloodGroup-filter">
          <option value="">All Blood Groups</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
        </select>
        <input type="text" id="city-filter" placeholder="Filter by city">
        <button type="submit"><span class="material-icons">search</span>Search</button>
      </form>
      <table class="details-table">
        <tr><th>Name</th><th>Email</th><th>Blood Group</th><th>City</th><th>Last Donation</th><th>Eligibility</th></tr>
        <tbody id="donor-results"></tbody>
      </table>
    </div>
  </main>
  <script src="../js/accountTypes.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/donors.js"></script>
</body>
</html>
