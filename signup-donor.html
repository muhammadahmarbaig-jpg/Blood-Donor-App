<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donor Sign Up - Blood Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-bar-mount"></div>
  <main class="auth-page">
    <div class="mui-card">
      <div id="back-button-mount"></div>
      <h2>Donor Sign Up</h2>
      <p id="error-message" class="alert alert-error page-hidden"></p>
      <form id="donor-signup-form">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <label for="phoneNumber">Phone Number (optional)</label>
        <input type="text" id="phoneNumber" placeholder="For pickup coordination">
        <label for="bloodGroup">Blood Group</label>
        <select id="bloodGroup" required>
          <option value="">Select</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
        </select>
        <label for="city">City</label>
        <input type="text" id="city" required>
        <label for="lastDonationDate">Last Donation Date &amp; Time (if any)</label>
        <input type="datetime-local" id="lastDonationDate">
        <label for="attachedSocietyId">Attached Society (optional)</label>
        <select id="attachedSocietyId">
          <option value="">None</option>
        </select>
        <button type="submit">Sign Up</button>
      </form>
      <p>Already have an account? <a class="text-link" href="login.html">Login here</a></p>
    </div>
  </main>
  <script src="../js/accountTypes.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/signup-donor.js"></script>
</body>
</html>
