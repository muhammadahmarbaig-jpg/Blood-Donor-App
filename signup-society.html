<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Society Sign Up - Blood Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-bar-mount"></div>
  <main class="auth-page">
    <div class="mui-card">
      <div id="back-button-mount"></div>
      <h2>Blood Group Society Sign Up</h2>
      <p id="error-message" class="alert alert-error page-hidden"></p>
      <form id="society-signup-form">
        <label for="fullName">Society Name</label>
        <input type="text" id="fullName" required>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <label for="city">City</label>
        <input type="text" id="city" required>
        <button type="submit">Sign Up</button>
      </form>
      <p>Already have an account? <a class="text-link" href="login.html">Login here</a></p>
    </div>
  </main>
  <script src="../js/accountTypes.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/signup-society.js"></script>
</body>
</html>
